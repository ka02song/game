<!DOCTYPE html>
<html>
<head>
    <title>Tetris</title>
    <style>
        body { background: #202028; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white; font-family: sans-serif; }
        .game-container { display: flex; gap: 20px; align-items: flex-start; }
        canvas { border: solid .2em #fff; background-color: #000; }
        #tetris { width: 240px; height: 400px; }
        #nextPiece { width: 80px; height: 80px; }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="tetris" width="12" height="20"></canvas>
        <div>
            <div>Next:</div>
            <canvas id="nextPiece" width="4" height="4"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const nextCanvas = document.getElementById('nextPiece');
        const nextContext = nextCanvas.getContext('2d');
        
        context.scale(20, 20);
        nextContext.scale(20, 20);

        const colors = [null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'];

        // 블록 생성 함수 수정: 인자가 없으면 랜덤 생성
        function createPiece(type) {
            const pieces = 'ILJOTSZ';
            const t = type || pieces[Math.random() * pieces.length | 0];
            const m = {
                'I': [[0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0]],
                'L': [[0, 3, 0], [0, 3, 0], [0, 3, 3]],
                'J': [[0, 4, 0], [0, 4, 0], [4, 4, 0]],
                'O': [[2, 2], [2, 2]],
                'T': [[0, 1, 0], [1, 1, 1], [0, 0, 0]],
                'S': [[0, 6, 6], [6, 6, 0], [0, 0, 0]],
                'Z': [[7, 7, 0], [0, 7, 7], [0, 0, 0]],
            };
            return m[t];
        }

        const arena = Array.from({length: 20}, () => new Array(12).fill(0));
        let player = { pos: {x: 5, y: 0}, matrix: createPiece() };
        let nextMatrix = createPiece(); 

        function drawNext() {
            nextContext.fillStyle = '#000';
            nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
            nextMatrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        nextContext.fillStyle = colors[value];
                        nextContext.fillRect(x, y, 1, 1);
                    }
                });
            });
        }

        function draw() {
            context.fillStyle = '#000';
            context.fillRect(0, 0, canvas.width, canvas.height);
            drawMatrix(arena, {x: 0, y: 0}, context);
            drawMatrix(player.matrix, player.pos, context);
        }

        function drawMatrix(matrix, offset, ctx) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        ctx.fillStyle = colors[value];
                        ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                // 블록 고정 후 줄 삭제 및 다음 블록 배치
                while(arenaSweep()); 
                player.matrix = nextMatrix;
                player.pos.y = 0;
                player.pos.x = 5;
                nextMatrix = createPiece();
                drawNext();
                if (collide(arena, player)) arena.forEach(row => row.fill(0));
            }
            dropCounter = 0;
        }

        function collide(a, p) {
            for(let y=0; y<p.matrix.length; y++) {
                for(let x=0; x<p.matrix[y].length; x++) {
                    if(p.matrix[y][x] !== 0 && (a[y+p.pos.y] && a[y+p.pos.y][x+p.pos.x]) !== 0) return true;
                }
            }
            return false;
        }
        function merge(a, p) { p.matrix.forEach((r, y) => r.forEach((v, x) => { if(v) a[y+p.pos.y][x+p.pos.x] = v; })); }
        function arenaSweep() {
            let rowCount = 0;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) if (arena[y][x] === 0) continue outer;
                arena.splice(y, 1)[0].fill(0);
                arena.unshift(new Array(12).fill(0));
                ++y;
                rowCount++;
            }
            return rowCount;
        }
        function rotate(m, d) { for(let y=0; y<m.length; y++) for(let x=0; x<y; x++) [m[x][y], m[y][x]] = [m[y][x], m[x][y]]; if(d>0) m.forEach(r => r.reverse()); else m.reverse(); }

        let dropCounter = 0;
        let lastTime = 0;
        function update(time = 0) {
            dropCounter += time - lastTime;
            lastTime = time;
            if (dropCounter > 1000) playerDrop();
            draw();
            requestAnimationFrame(update);
        }

        document.addEventListener('keydown', e => {
            if (e.keyCode === 37) { if(player.pos.x > 0) player.pos.x--; }
            else if (e.keyCode === 39) { if(player.pos.x < 12 - player.matrix[0].length) player.pos.x++; }
            else if (e.keyCode === 40) playerDrop();
            else if (e.keyCode === 38) { rotate(player.matrix, 1); if(collide(arena, player)) rotate(player.matrix, -1); }
        });

        drawNext();
        update();
    </script>
</body>
</html>
